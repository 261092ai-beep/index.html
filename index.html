<!DOCTYPE html>
<html>
    <head>
        <title>College Admission Management</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>College Admission Management System</h1>
        <p>Welcome to our college</p>
        <h2>Student Admission Form</h2>
        <form id="admissionForm"> 
            <label>Student Name:</label><br>
            <input type="text"placeholder="Enter your name" required><br><br>
            <label>Email:</label><br>
            <input type="email" placeholder="Enter your email" required><br><br>
            <label>Phone Number:</label><br>
            <input type="tel" placeholder="Enter Phone Number" required><br><br>
            <label>Select Course:</label><br>
            <select required>
                <option value="">Choose a course</option>
                <option>B.E Computer Science and Engineering</option>
                <option>B.E Electronics and Communication Engineering</option>
                <option>B.Tech Artificial Intelligence and Data Science</option>
            </select><br><br>
            <button type="Submit">Submit Application</button>
        </form>
        <script src="script.js"></script>
    </body>
</html>
